apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sprouts
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - host: sprouts.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
