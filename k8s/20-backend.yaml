apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: backend
  annotations:
    kubernetes.io/change-cause: "Deploy Sprouts backend API from DockerHub image"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sprouts
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sprouts
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: sprouts-runtime
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sprouts
                    app.kubernetes.io/component: database
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: piasekdev/sprouts-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: sprouts-config
                  key: APP_ENV
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: sprouts-config
                  key: RUST_LOG
            - name: BIND_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: sprouts-config
                  key: BIND_ADDRESS
            - name: DATABASE_MAX_CONNECTIONS
              valueFrom:
                configMapKeyRef:
                  name: sprouts-config
                  key: DATABASE_MAX_CONNECTIONS
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sprouts-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
