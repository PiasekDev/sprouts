apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: frontend
  annotations:
    kubernetes.io/change-cause: "Deploy Sprouts frontend SPA from DockerHub image"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sprouts
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sprouts
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: sprouts-runtime
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sprouts
                    app.kubernetes.io/component: frontend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: piasekdev/sprouts-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
