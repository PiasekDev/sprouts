apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
    app.kubernetes.io/component: backend-migrate
  annotations:
    kubernetes.io/change-cause: "Run Sprouts backend database migrations"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sprouts
        app.kubernetes.io/component: backend-migrate
    spec:
      serviceAccountName: sprouts-runtime
      restartPolicy: OnFailure
      containers:
        - name: backend-migrate
          image: piasekdev/sprouts-backend:latest
          imagePullPolicy: Always
          command:
            - backend
            - migrate
          env:
            - name: RUST_LOG
              valueFrom:
                configMapKeyRef:
                  name: sprouts-config
                  key: RUST_LOG
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sprouts-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
