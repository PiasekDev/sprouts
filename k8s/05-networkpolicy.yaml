apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sprouts
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sprouts
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sprouts
              app.kubernetes.io/component: frontend
      ports:
        - protocol: TCP
          port: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
  namespace: sprouts
  labels:
    app.kubernetes.io/name: sprouts
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sprouts
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sprouts
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sprouts
              app.kubernetes.io/component: backend-migrate
      ports:
        - protocol: TCP
          port: 5432
