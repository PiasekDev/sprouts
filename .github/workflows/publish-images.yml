name: Publish images

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: Also update the latest tag
        required: true
        default: true
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: backend/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: sprouts-backend
      meta-images: piasekdev/sprouts-backend
      meta-tags: |
        type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.push_latest == true }}
        type=sha,prefix=sha-
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  frontend:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      output: image
      push: true
      context: .
      file: frontend/Dockerfile
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: sprouts-frontend
      meta-images: piasekdev/sprouts-frontend
      meta-tags: |
        type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.push_latest == true }}
        type=sha,prefix=sha-
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
